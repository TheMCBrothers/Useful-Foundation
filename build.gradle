plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.0'
    id 'me.shedaniel.unified-publishing' version '0.1.+'
}

version = "$minecraft_version-$mod_version"
group = mod_group_id

repositories {
    maven { url = 'https://nexus.themcbrothers.net/repository/maven-mod-dependencies/' }
    mavenLocal()
}

base {
    archivesName = archive_base
}

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        // applies to all the run configs below
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'

            gameDirectory = project.file("runs/${name}")
        }

        client {
            type = 'client'

            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            type = 'server'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            type = 'data'

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    if (lib_version) {
        // TheMCBrosLib
        implementation "net.themcbrothers:themcbroslib:$lib_version"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: version,
            mod_authors         : mod_authors, mod_description: mod_description,
            github_repo         : github_repo, curse_project: curse_project,
            lib_version_range   : lib_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    from(rootProject.file('LICENSE'))

    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
        ])
    }

    exclude('net/themcbrothers/**/datagen/**')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = archive_base
        }
    }
    repositories {
        maven {
            credentials {
                username = System.getenv('NEXUS_UNAME')
                password = System.getenv('NEXUS_PWD')
            }

            if (version.endsWith('-SNAPSHOT')) {
                url 'https://nexus.themcbrothers.net/repository/maven-snapshots/'
            } else {
                url 'https://nexus.themcbrothers.net/repository/maven-releases/'
            }
        }
    }
}

unifiedPublishing {
    project {
        displayName = "[$minecraft_version] v$mod_version"
        releaseType = artifact_type
        gameVersions.addAll(minecraft_supported_versions.split(","))
        gameLoaders = ['neoforge']

        mainPublication tasks.jar

        var curseforgeToken = System.getenv('CURSEFORGE_TOKEN')
        var modrinthToken = System.getenv('MODRINTH_TOKEN')
        var changes = file('changelog.md').text

        if (curseforgeToken != null && !curse_project.isEmpty()) {
            curseforge {
                token = curseforgeToken
                id = curse_project
                changelog = changes
                gameVersions.addAll 'Java 21'
            }
        }

        if (modrinthToken != null && !modrinth_project.isEmpty()) {
            modrinth {
                token = modrinthToken
                id = modrinth_project
                changelog = changes.substring(changes.indexOf('\n'), changes.indexOf('\n\n'))
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}